spring.application.name=spring-boot-ai-sdlc-owasp-review-agent

# Chat model provider used for reviews: openai or anthropic
spring.ai.model.chat=${AI_PROVIDER:openai}

# Only chat is used, so the other OpenAI model auto-configurations stay off
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-haiku-4-5}
spring.ai.anthropic.chat.options.temperature=0.2
spring.ai.anthropic.chat.options.max-tokens=4096

management.endpoints.web.exposure.include=health,info

server.error.include-message=always
server.error.include-binding-errors=always

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

owasp.review.max-files=40
owasp.review.max-file-characters=100000
owasp.review.max-total-characters=400000
owasp.review.batch-characters=80000
owasp.review.max-archive-bytes=8000000
owasp.review.max-archive-entries=1000
